<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão | Car Dealer IA</title>
    <meta name="theme-color" content="#ff5a1f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090d;
        --panel: #12161d;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f6f7fb;
        --muted: #9ca3af;
        --orange: #ff5a1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }

      .offline-card {
        width: 100%;
        max-width: 360px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px 24px;
        box-shadow: 0 22px 65px rgba(0, 0, 0, 0.38);
      }

      .offline-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin: 0 auto 18px;
        display: block;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }

      button {
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--orange), #ff6a21);
        color: #050507;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: transform 0.18s ease;
        }

        button:active {
          transform: scale(0.98);
        }
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <img
        class="offline-logo"
        src="./assets/icons/icon-192.png"
        alt="Car Dealer IA"
        width="64"
        height="64"
      />
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível carregar esta página. Verifique sua internet e tente
        novamente.
      </p>
      <button type="button" id="offlineRetryButton">Tentar novamente</button>
    </main>
    <script src="./js/offline.js" defer></script>
  </body>
</html>
